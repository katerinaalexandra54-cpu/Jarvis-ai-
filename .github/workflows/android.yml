name: Build JARVIS APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Extract JARVIS V2
        run: |
          unzip -q "jarvis-app-v2.zip" -d extracted
          test -f extracted/jarvis-app/package.json

      - name: Install dependencies
        working-directory: extracted/jarvis-app
        run: npm install

      - name: Build web app
        working-directory: extracted/jarvis-app
        run: npm run build

      - name: Generate Android project
        working-directory: extracted/jarvis-app
        run: npx cap add android

      - name: Set up Android bridge and icons
        working-directory: extracted/jarvis-app
        run: npm run android:setup

      - name: Sync Capacitor
        working-directory: extracted/jarvis-app
        run: npx cap sync android

      - name: Decode signing key
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > extracted/jarvis-app/jarvis-release.jks

      - name: Build signed release APK
        working-directory: extracted/jarvis-app/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/extracted/jarvis-app/jarvis-release.jks" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-APK-SIGNED
          path: extracted/jarvis-app/android/app/build/outputs/apk/release/app-release.apk
